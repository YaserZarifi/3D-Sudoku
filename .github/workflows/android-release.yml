name: Android release

# Builds a signed APK and publishes it as a GitHub release.
# It runs when a tag like v1.0.0 is pushed, when release notes are added or
# changed in docs/releases/ (the newest version there is released), or by
# hand from the Actions tab. Release notes come from docs/releases/<tag>.md.
#
# Signing: set the repository secrets ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS to sign every release with
# the same key, so updates install over older versions. Without them a new
# key is made for each build.

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "docs/releases/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, like v1.0.0"
        required: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5.1-stable

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(ls docs/releases | grep -E '^v[0-9]' | sed 's/\.md$//' | sort -V | tail -1)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No release version found."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install Godot and Android templates
        run: |
          bash scripts/tools/setup_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 scripts/tools/fetch_android_templates.py "$GODOT_VERSION"

      - name: Point Godot at the Android SDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ls "$sdk/build-tools"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            password="$KEYSTORE_PASSWORD"
            alias="$KEY_ALIAS"
          else
            echo "::warning::No signing secrets set, using a one-off key for this build."
            password="$(openssl rand -hex 16)"
            alias="sudoku3d"
            keytool -genkeypair -keystore "$keystore" -alias "$alias" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$password" -keypass "$password" \
              -dname "CN=3D Sudoku, O=YaserZarifi"
          fi
          echo "::add-mask::$password"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$alias"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Stamp version
        run: |
          sed -i "s/^version\/name=.*/version\/name=\"${{ steps.version.outputs.name }}\"/" export_presets.cfg
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          grep -E "^version/" export_presets.cfg

      - name: Import and test
        run: |
          godot --headless --path . --import
          godot --headless --path . -s tests/run_tests.gd

      - name: Export APK
        run: |
          apk="builds/android/3d-sudoku-${{ steps.version.outputs.name }}.apk"
          mkdir -p builds/android
          godot --headless --path . --export-release "Android" "$apk" 2>&1 | tee export.log
          if grep -q "The resulting APK is unsigned" export.log; then
            echo "::error::The APK was not signed."
            exit 1
          fi
          test -f "$apk"
          apksigner="$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose "$apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          notes="docs/releases/${{ steps.version.outputs.tag }}.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "3D Sudoku ${{ steps.version.outputs.name }}" > release-notes.md; fi
          {
            echo
            echo "### Checksum"
            echo
            echo '```'
            sha256sum "$APK" | sed "s|builds/android/||"
            echo '```'
          } >> release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 3D Sudoku ${{ steps.version.outputs.name }}
          body_path: release-notes.md
          files: ${{ env.APK }}
          make_latest: true
